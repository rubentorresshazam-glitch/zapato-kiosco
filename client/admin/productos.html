<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos | Kiosco Zapato</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/productos.css">
</head>
<body>

<div class="admin-layout">
    <!-- Menú lateral -->
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <div class="logo-admin">
                <img src="../assets/img/logos/logo-zapato.png" alt="Logo Kiosco Zapato">
                <span>KIOSCO ZAPATO</span>
            </div>
        </div>
        <nav class="sidebar-menu">
            <a href="index.html" class="menu-item"><i class="fa-solid fa-house"></i> <span>Inicio</span></a>
            <a href="productos.html" class="menu-item active"><i class="fa-solid fa-box"></i> <span>Productos</span></a>
            <a href="pedidos.html" class="menu-item"><i class="fa-solid fa-shopping-cart"></i> <span>Pedidos</span></a>
            <a href="facturacion.html" class="menu-item"><i class="fa-solid fa-file-invoice-dollar"></i> <span>Facturación</span></a>
            <a href="estadisticas.html" class="menu-item"><i class="fa-solid fa-chart-line"></i> <span>Estadísticas</span></a>
            <a href="../index.html" class="menu-item salir"><i class="fa-solid fa-arrow-left"></i> <span>Volver a la tienda</span></a>
        </nav>
    </aside>

    <main class="admin-main">
        <h1>Gestión de Productos</h1>

        <!-- Formulario — Responsivo para CELULAR -->
        <div class="formulario-producto">
            <h2 id="titulo-form">Agregar Nuevo Producto</h2>
            <form id="formProducto">
                <input type="hidden" id="productoId">
                
                <div class="fila-form">
                    <label>Nombre del Producto *</label>
                    <input type="text" id="nombre" required placeholder="Ej: Cable USB-C Reforzado">
                </div>

                <div class="fila-form">
                    <label>Categoría</label>
                    <select id="categoria">
                        <option value="General">General</option>
                        <option value="Telefonía y Accesorios">Telefonía y Accesorios</option>
                        <option value="Cables y Cargadores">Cables y Cargadores</option>
                        <option value="Auriculares y Audio">Auriculares y Audio</option>
                        <option value="Pesca y Camping">Pesca y Camping</option>
                        <option value="Automotor / Bici">Automotor / Bici</option>
                        <option value="Aromatizantes y Hogar">Aromatizantes y Hogar</option>
                    </select>
                </div>

                <div class="fila-form-doble">
                    <div>
                        <label>Precio *</label>
                        <input type="number" id="precio" required placeholder="0" step="10">
                    </div>
                    <div>
                        <label>Stock</label>
                        <input type="number" id="stock" placeholder="0">
                    </div>
                </div>

                <div class="fila-form-doble">
                    <div>
                        <label>¿En oferta?</label>
                        <input type="checkbox" id="enOferta">
                    </div>
                    <div>
                        <label>Precio de Oferta</label>
                        <input type="number" id="precioOferta" placeholder="0" step="10">
                    </div>
                </div>

                <div class="fila-form">
                    <label>Descripción Corta</label>
                    <textarea id="descripcionCorta" rows="2" placeholder="Breve descripción que aparece en la tarjeta..."></textarea>
                </div>

                <div class="fila-form">
                    <label>Descripción Completa</label>
                    <textarea id="descripcionLarga" rows="4" placeholder="Detalles completos del producto..."></textarea>
                </div>

                <!-- 📤 SUBIDA DE IMÁGENES — Funciona desde CELULAR -->
                <div class="fila-form">
                    <label>Imágenes del Producto <small>(puedes subir varias)</small></label>
                    <input type="file" id="imagenInput" accept="image/*" multiple style="display:none;">
                    <button type="button" class="btn-primario" id="btnSubirImagen">
                        <i class="fa-solid fa-cloud-upload-alt"></i> Seleccionar Imágenes
                    </button>
                    <div id="listaImagenes" class="vista-previa-imagenes"></div>
                    <p id="estadoSubida" style="margin-top:0.5rem; color:#666;">Sin imágenes seleccionadas</p>
                </div>

                <div class="fila-form">
                    <button type="submit" class="btn-primario" style="width:100%; font-size:1.1rem; padding:0.8rem;">
                        <i class="fa-solid fa-save"></i> Guardar Producto
                    </button>
                </div>
            </form>
        </div>

        <!-- Lista de productos -->
        <div class="lista-productos">
            <h2>Productos Cargados</h2>
            <div id="contenedorProductos">
                <p style="text-align:center; color:#888; padding:2rem;">Cargando productos...</p>
            </div>
        </div>
    </main>
</div>

<script src="js/productos.js"></script>
</body>
</html>
